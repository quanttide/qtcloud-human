[package]
name = "qtcloud-human-cli"
version = "0.1.0"
edition = "2024"
description = "QtCloud Human CLI — 招聘计划与岗位管理"

[[bin]]
name = "qtcloud-human"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[dev-dependencies]
tempfile = "3"
